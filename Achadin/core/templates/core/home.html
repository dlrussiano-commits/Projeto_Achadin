{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{% static 'core/icones/logo.svg' %}">
    <title>Achadin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/desing_home.css' %}">
    <link rel="stylesheet" href="{% static 'loja/desing_loja.css' %}">

    <style>
        :root { --lateral: #d9e3f6; }   /* cor das colunas laterais: troque aqui */

        /* Colunas laterais preenchendo a tela até embaixo */
        html, body { background: var(--lateral); }
        body { min-height: 100vh; display: flex; flex-direction: column; }
        .layout_principal { flex: 1 0 auto; align-items: stretch !important; }
        .coluna_lateral { background: var(--lateral) !important; }
        .conteudo_central { display: block !important; min-width: 0; background: #f8f9ff; }

        /* Esteira de categorias */
        .esteira {
            display: block !important;
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
            overflow: hidden;
            padding: 24px 0;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
        }
        .esteira_faixa {
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important;
            width: max-content;
            animation: esteira 50s linear infinite;   /* maior = mais lento */
        }
        .esteira:hover .esteira_faixa { animation-play-state: paused; }

        .esteira .orientacao_a {
            flex: 0 0 auto !important;
            width: auto !important;
            max-width: none !important;
            margin: 0 !important;
            padding: 0 28px !important;
            display: flex !important;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .esteira .botao_categoria_imagem { width: 170px !important; height: 170px !important; }
        .esteira .atributos_span { white-space: nowrap; text-align: center; }

        @keyframes esteira {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }
        @media (prefers-reduced-motion: reduce) {
            .esteira_faixa { animation: none; }
            .esteira { overflow-x: auto; }
        }
    </style>
</head>
<body>

{% include 'core/_navbar.html' %}

<div class="layout_principal">
    <aside class="coluna_lateral"></aside>

    <main class="conteudo_central">
        <nav class="esteira">
            <div class="esteira_faixa">
                <a class="orientacao_a" href="{% url 'exibir_categorias' 'r.l' %}">
                    <img src="{% static 'core/icones/home_r.l.svg' %}" alt="Restaurantes e Lanchonetes" class="botao_categoria_imagem">
                    <span class="atributos_span">Restaurantes e Lanchonetes</span>
                </a>
                <a class="orientacao_a" href="{% url 'exibir_categorias' 'mercados' %}">
                    <img src="{% static 'core/icones/home_mercados.svg' %}" alt="Mercados" class="botao_categoria_imagem">
                    <span class="atributos_span">Mercados</span>
                </a>
                <a class="orientacao_a" href="{% url 'exibir_categorias' 'r.c.a' %}">
                    <img src="{% static 'core/icones/home_r.c.a.svg' %}" alt="Roupas, Calçados e Acessórios" class="botao_categoria_imagem">
                    <span class="atributos_span">Roupas, Calçados e Acessórios</span>
                </a>
                <a class="orientacao_a" href="{% url 'exibir_categorias' 'f.c' %}">
                    <img src="{% static 'core/icones/home_f.c.svg' %}" alt="Ferramentas e Construção" class="botao_categoria_imagem">
                    <span class="atributos_span">Ferramentas e Construção</span>
                </a>
                <a class="orientacao_a" href="{% url 'exibir_categorias' 'm.b' %}">
                    <img src="{% static 'core/icones/home_m.b.svg' %}" alt="Moda e Beleza" class="botao_categoria_imagem">
                    <span class="atributos_span">Moda e Beleza</span>
                </a>
                <a class="orientacao_a" href="{% url 'exibir_categorias' 'pet-shop' %}">
                    <img src="{% static 'core/icones/home_pet-shop.svg' %}" alt="Pet-shop" class="botao_categoria_imagem">
                    <span class="atributos_span">Pet-shop</span>
                </a>
                <a class="orientacao_a" href="{% url 'exibir_categorias' 'saude' %}">
                    <img src="{% static 'core/icones/home_saude.svg' %}" alt="Saúde" class="botao_categoria_imagem">
                    <span class="atributos_span">Saúde</span>
                </a>
                <a class="orientacao_a" href="{% url 'exibir_categorias' 'm.g' %}">
                    <img src="{% static 'core/icones/home_m.g.svg' %}" alt="Músicas e Games" class="botao_categoria_imagem">
                    <span class="atributos_span">Músicas e Games</span>
                </a>
            </div>
        </nav>

        <div class="display_banners">
            <img class="banner" src="{% static 'core/banners/banner_mercados_b.svg' %}">
            <img class="banner" src="{% static 'core/banners/banner_mercados_c.svg' %}">
            <img class="banner" src="{% static 'core/banners/banner_petshop_d.svg' %}">
            <img class="banner" src="{% static 'core/banners/banner_mercados_d.svg' %}">
            <img class="cupons" src="{% static 'core/cupons/cupons_em_destaque.png' %}">
        </div>
    </main>

    <aside class="coluna_lateral"></aside>
</div>

<script>
    // Duplica os ícones para a esteira girar sem deixar buraco
    const faixa = document.querySelector('.esteira_faixa');
    faixa.querySelectorAll('.orientacao_a').forEach(a => {
        const copia = a.cloneNode(true);
        copia.setAttribute('aria-hidden', 'true');
        copia.tabIndex = -1;
        faixa.appendChild(copia);
    });
</script>

</body>
</html>
